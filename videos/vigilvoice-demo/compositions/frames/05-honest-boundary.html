  <script>
    (() => {
      const id = "05-honest-boundary";
      const statement = document.getElementById(`${id}-statement`);
      const support = document.getElementById(`${id}-support`);
      const brand = document.getElementById(`${id}-brand`);
      const label = document.getElementById(`${id}-label`);
      const states = [
        { t: 0, text: "simulated transfer", size: "6.2cqw" },
        { t: 1.7, text: "not speaker authentication", size: "5.15cqw" },
        { t: 3.8, text: "Indian-language accuracy:\nnot validated", size: "4.45cqw" },
      ];
      const tl = gsap.timeline({ paused: true });
      const driver = { t: 0 };
      let current = 0;

      function stateAt(t) {
        for (let i = states.length - 1; i >= 0; i--) {
          if (t >= states[i].t) return i;
        }
        return 0;
      }

      tl.to(driver, {
        t: 6.379,
        duration: 6.379,
        ease: "none",
        onUpdate: () => {
          const next = stateAt(driver.t);
          if (next === current) return;
          statement.textContent = states[next].text;
          statement.style.fontSize = states[next].size;
          current = next;
        },
      }, 0);

      tl.fromTo(statement, { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.35, ease: "power4.out" }, 0.05);

      // The three words arrive at reading pace inside Scene 1.
      const words = ["no", "money", "moves"];
      let cue = 0.68;
      words.forEach((word) => {
        tl.fromTo(document.getElementById(`${id}-${word}`),
          { x: 26, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.28, ease: "power4.out" }, cue);
        cue += 0.11 + word.length * 0.018;
      });
      tl.to(support, { opacity: 0, duration: 0.25, ease: "none" }, 1.42);

      // Match leftward velocity at both internal text-state seams.
      [1.7, 3.8].forEach((cut) => {
        tl.to(statement, { x: -230, duration: 0.3, ease: "power4.in" }, cut - 0.3);
        tl.to(statement, { opacity: 0, duration: 0.28, ease: "none" }, cut - 0.28);
        tl.set(statement, { x: 230, opacity: 0.35 }, cut);
        tl.to(statement, { x: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, cut);
      });

      tl.fromTo(brand, { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 4.75);
      tl.fromTo(label, { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 5.3);

      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;
    })();
