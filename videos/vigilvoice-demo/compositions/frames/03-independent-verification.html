    (() => {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["03-independent-verification"] = tl;

      const risk = document.getElementById("03-independent-verification-risk");
      const verify = document.getElementById("03-independent-verification-verify");
      const headline = document.getElementById("03-independent-verification-headline");
      const kicker = document.getElementById("03-independent-verification-kicker");
      const words = [...document.getElementById("03-independent-verification-words").querySelectorAll("span")];

      tl.fromTo(risk, { x: -110, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);
      tl.fromTo(headline, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.1);
      tl.fromTo(verify, { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.52, ease: "power3.out" }, 1.7);

      const labels = [
        { t: 0, text: "VOICE EVIDENCE" },
        { t: 1.7, text: "INDEPENDENT VERIFICATION" }
      ];
      const labelClock = { t: 0 };
      let lastLabel = labels[0].text;
      tl.to(labelClock, {
        t: 4.5, duration: 4.5, ease: "none",
        onUpdate: () => {
          let current = labels[0].text;
          for (let i = labels.length - 1; i >= 0; i--) {
            if (labelClock.t >= labels[i].t) { current = labels[i].text; break; }
          }
          if (current !== lastLabel) { kicker.textContent = current; lastLabel = current; }
        }
      }, 0);

      tl.to(headline, { y: -95, opacity: 0, duration: 0.32, ease: "power4.in" }, 4.1);
      const wordStart = 4.61;

        elapsed += 0.24 + word.textContent.length * 0.03;
      });
      tl.to(words, { opacity: 0, duration: 0.25, ease: "power2.in" }, 6.15);
