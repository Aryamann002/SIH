    (() => {
      const root = document.querySelector('[data-composition-id="02-local-evidence"]');
      const surface = root.querySelector('[id="02-local-evidence-surface"]');
      const world = root.querySelector('[id="02-local-evidence-world"]');
      const lowPane = root.querySelector('[id="02-local-evidence-low-pane"]');
      const actionPane = root.querySelector('[id="02-local-evidence-action-pane"]');
      const kicker = root.querySelector('[id="02-local-evidence-kicker"]');
      const cam = { scale: 1, x: 0, y: 0 };
      const applyCamera = () => {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      };
      applyCamera();
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['02-local-evidence'] = tl;

      tl.fromTo(surface, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.72, ease: 'power3.out' }, 0);
      tl.to(cam, { y: -800, duration: 1.92, ease: 'power2.inOut', onUpdate: applyCamera }, 1.5);

      // The final screen state is an instant cut to two measured crops of the same capture.
      const states = [{ t: 0, text: '01 / EVIDENCE' }, { t: 3.5, text: '02 / ACTION' }];
      const driver = { t: 0 };
      tl.to(driver, {
        t: 5.141,
        duration: 5.141,
        ease: 'none',
        onUpdate: () => {
          let state = states[0];
          for (let i = states.length - 1; i >= 0; i--) {
            if (driver.t >= states[i].t) { state = states[i]; break; }
          }
          kicker.textContent = state.text;
        },
      }, 0);
      tl.fromTo(lowPane, { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.28, ease: 'power2.out' }, 3.5);
