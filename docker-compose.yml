services:
  db:
    image: postgres:16-alpine
    container_name: vigilvoice_db
    environment:
      POSTGRES_DB: vigilvoice
      POSTGRES_USER: vigilvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure_demo.py}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilvoice -d vigilvoice"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${VIGILVOICE_BACKEND_IMAGE:-vigilvoice:local}
    build: .
    container_name: vigilvoice_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://vigilvoice:${POSTGRES_PASSWORD}@db:5432/vigilvoice
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:?Run python scripts/configure_demo.py}
      DEMO_VERIFIER_KEY: ${DEMO_VERIFIER_KEY:?Run python scripts/configure_demo.py}
      LAYA_MODE: ${LAYA_MODE:-shadow}
      LAYA_ENABLED: ${LAYA_ENABLED:-false}
      LAYA_ADVISORY_ENABLED: ${LAYA_ADVISORY_ENABLED:-false}
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy

  laya:
    profiles: ["laya"]
    image: vigilvoice-laya:local
    pull_policy: never
    command: ["laya-serve"]
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_DEVICE: cpu
      LAYA_MODELS: english
      LAYA_PRELOAD: "1"
      LAYA_THREADS: "4"
      LAYA_REVISION: 55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851
      HF_HUB_OFFLINE: ${LAYA_HF_OFFLINE:-0}
      HF_HUB_DISABLE_XET: ${LAYA_HF_DISABLE_XET:-0}
    volumes:
      - laya_cache:/home/laya/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 15m
      retries: 3

volumes:
  postgres_data:
  laya_cache:
